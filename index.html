<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>チームのお知らせ</title>
  <meta name="description" content="チームからのお知らせ一覧">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="./">チームのお知らせ</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="表示テーマを切り替える">🌙</button>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">お知らせ一覧</h1>

    <div id="filters" class="filters" role="group" aria-label="カテゴリで絞り込む"></div>

    <p id="status" class="status" aria-live="polite">読み込み中…</p>
    <ul id="news-list" class="news-list"></ul>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> チームのお知らせ</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
